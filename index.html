<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<!-- Placeholder content for now: keep out of search engines. Remove once real content is in. -->
<meta name="robots" content="noindex">
<title>Portfolio</title>
<meta name="description" content="Portfolio of Siarhei Meliashchuk.">
<style>
  :root {
    --bg: #f5f5f9;
    --surface: #ffffff;
    --ink: #1c1c22;
    --muted: #6d6d7a;
    --line: #e2e2ea;
    --accent: #5b4bdb;
    --ph: #e9e9f1;
    --shadow: 0 18px 38px rgba(56, 52, 110, .16), 0 3px 8px rgba(56, 52, 110, .08);
    --maxw: 1080px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }

  /* Header */
  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(12px);
  }
  .top .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
  .brand { font-weight: 600; text-decoration: none; margin-right: auto; }
  nav { display: flex; gap: 24px; }
  nav a { text-decoration: none; color: var(--muted); font-size: 15px; font-weight: 500; }
  nav a:hover { color: var(--ink); }

  /* Hero */
  .hero { padding-top: 64px; padding-bottom: 28px; }
  .who { margin: 0 0 6px; font-size: 20px; font-weight: 500; color: var(--muted); }
  .eyebrow {
    display: inline-block; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 16px;
  }
  h1 { font-size: clamp(40px, 6.4vw, 68px); line-height: 1.05; letter-spacing: -0.03em; margin: 0; font-weight: 700; }
  .lead { font-size: clamp(18px, 2.1vw, 21px); color: var(--muted); max-width: 640px; margin: 0 0 30px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn {
    display: inline-block; padding: 12px 22px; border-radius: 999px; text-decoration: none;
    font-weight: 600; font-size: 16px; background: var(--surface);
    box-shadow: 0 1px 3px rgba(56,52,110,.14); transition: transform .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary { background: var(--ink); color: #fff; }

  /* Sections: uppercase label with a thin rule */
  section { padding: 44px 0 20px; }
  h2 {
    display: flex; align-items: center; gap: 22px; margin: 0 0 34px;
    font-size: 15px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    white-space: nowrap;
  }
  h2::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: var(--line); }
  .sub { color: var(--muted); margin: -14px 0 30px; max-width: 640px; font-size: 16px; }

  .about { display: grid; grid-template-columns: 200px 1fr; gap: 40px; align-items: start; }
  .photo {
    aspect-ratio: 1; border-radius: 26%; background: linear-gradient(145deg, #dcdcf0, #c9c6ea);
    box-shadow: var(--shadow);
    display: grid; place-items: center; color: #6a66a0; font-size: 14px; font-weight: 500; text-align: center; padding: 12px;
  }
  .about p { margin: 0 0 14px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 24px; }
  .fact { background: var(--surface); border-radius: 20px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(56,52,110,.10); }
  .fact b { display: block; font-size: 28px; letter-spacing: -0.02em; }
  .fact span { color: var(--muted); font-size: 14px; }

  /* Project icons */
  .apps { display: grid; grid-template-columns: repeat(auto-fill, 180px); gap: 44px 2px; margin-bottom: 26px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 18px; text-decoration: none; text-align: center; }
  .icon {
    width: 148px; aspect-ratio: 1; border-radius: 27%; box-shadow: var(--shadow);
    display: grid; place-items: center; overflow: hidden;
    color: rgba(255,255,255,.92); font-size: 54px; font-weight: 700;
    transition: transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .app:hover .icon { transform: translateY(-5px) scale(1.03); }
  .app .name { font-size: 18px; font-weight: 500; line-height: 1.3; max-width: 180px; }
  .app .note { display: block; font-size: 14px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .g1 { background: linear-gradient(145deg, #3a2a78, #1b1440); }
  .g2 { background: linear-gradient(145deg, #4f7fe6, #2b3fa6); }
  .g3 { background: linear-gradient(145deg, #45d6c8, #1f9fb0); }
  .g4 { background: linear-gradient(145deg, #ffcf7a, #f29a4b); }
  .g5 { background: linear-gradient(145deg, #7a5cf5, #3d22c9); }

  .skills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .skills > div { background: var(--surface); border-radius: 22px; padding: 20px 22px; box-shadow: 0 1px 3px rgba(56,52,110,.10); }
  .skills h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  .skills ul { margin: 0; padding: 0; list-style: none; color: var(--muted); }
  .skills li { padding: 6px 0; }

  .contact .cta { margin-top: 4px; }
  footer { padding: 46px 0 40px; color: var(--muted); font-size: 14px; }

  .ph { border-bottom: 2px dotted #b9b3ee; }

  @media (max-width: 860px) {
    nav { display: none; }
    .wrap { padding: 0 20px; }
    .hero { padding-top: 44px; padding-bottom: 28px; }
    .about { grid-template-columns: 1fr; }
    .photo { max-width: 160px; }
    .skills, .facts { grid-template-columns: 1fr; }
    h2 { font-size: 13px; gap: 14px; margin-bottom: 26px; }
  }
  @media (max-width: 520px) {
    .apps { grid-template-columns: repeat(2, 1fr); gap: 34px 12px; }
    .icon { width: min(132px, 36vw); font-size: 44px; }
    .app .name { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .btn, .icon { transition: none; }
  }

  /* Game player (opens over the page) */
  body.playing { overflow: hidden; }
  a:focus-visible, button:focus-visible { outline: 3px solid #8d70ef; outline-offset: 6px; }
  dialog {
    --left: max(12px, env(safe-area-inset-left)); --right: max(12px, env(safe-area-inset-right));
    --top: max(12px, env(safe-area-inset-top)); --bottom: max(12px, env(safe-area-inset-bottom));
    --game-width: min(calc((100dvh - var(--top) - var(--bottom)) * .5625), calc(100vw - var(--left) - var(--right) - 56px), 450px);
    padding: 0; border: 0; background: transparent; color: white; max-width: none; max-height: none; overflow: visible;
    width: calc(var(--game-width) + 56px); margin: auto;
  }
  dialog[open] { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; }
  dialog::backdrop { background: #14101fef; backdrop-filter: blur(16px); }
  dialog h2::after { content: none; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .back-button {
    grid-column: 1; grid-row: 1; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; cursor: pointer;
    border: 1px solid #ffffff24; background: #ffffff0c; border-radius: 50%; color: #e3ddec;
  }
  .back-button:hover { background: #ffffff20; }
  .game-viewport {
    grid-column: 2; grid-row: 1; position: relative; width: 100%; min-width: 0; aspect-ratio: 9 / 16;
    background: #120d2b; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 70px #0006; outline: 1px solid #ffffff18;
  }
  .game-viewport iframe { position: absolute; top: 0; left: 0; display: block; width: 450px; height: 800px; border: 0; transform-origin: top left; }
</style>
</head>
<body>

<main id="top">
  <div class="wrap hero">
    <p class="who">Siarhei Meliashchuk</p>
    <h1>Portfolio</h1>
  </div>

  <section id="work">
    <div class="wrap">
      <h2>Running products</h2>
      <div class="apps">
        <a class="app" href="#play/neon-arrow-escape" data-game="neon-arrow-escape" data-title="Arrow Master Playable" aria-label="Play Arrow Master Playable">
          <span class="icon"><img src="assets/neon-arrow-escape.svg" alt="" width="148" height="148"></span>
          <span class="name">Arrow Master Playable</span>
        </a>
        <a class="app" href="#play/slide-hustle" data-game="slide-hustle" data-title="Slide Hustle" aria-label="Play Slide Hustle">
          <span class="icon"><img src="assets/slide-hustle.png" alt="" width="148" height="148"></span>
          <span class="name">Slide Hustle</span>
        </a>
      </div>
    </div>
    <div class="wrap">
      <h2>New games</h2>
      <div class="apps">
        <a class="app" href="#play/ring-master" data-game="ring-master" data-title="Ring Master" aria-label="Play Ring Master">
          <span class="icon"><img src="assets/ring-master.png" alt="" width="148" height="148"></span>
          <span class="name">Ring Master</span>
        </a>
        <a class="app" href="#play/croc-escape" data-game="croc-escape" data-title="Croc Escape" aria-label="Play Croc Escape">
          <span class="icon"><img src="assets/croc-escape.png" alt="" width="148" height="148"></span>
          <span class="name">Croc Escape</span>
        </a>
        <a class="app" href="#play/wordblock" data-game="wordblock" data-title="Wordblock" aria-label="Play Wordblock">
          <span class="icon"><img src="assets/wordblock.png" alt="" width="148" height="148"></span>
          <span class="name">Wordblock</span>
        </a>
      </div>
    </div>
  </section>
</main>

<dialog id="player" aria-labelledby="player-title">
  <h2 id="player-title" class="visually-hidden"></h2>
  <div class="game-viewport" id="game-viewport"></div>
  <button id="close-player" class="back-button" type="button" aria-label="Back to portfolio" title="Back to portfolio"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
</dialog>

<script>
(function () {
  var player = document.getElementById('player');
  var viewport = document.getElementById('game-viewport');
  var closeButton = document.getElementById('close-player');
  var activeId = null, returnFocus = null;

  // Games are designed for 450x800; scale the frame to the available width.
  function fitGame() {
    var frame = viewport.querySelector('iframe');
    if (frame && player.open) frame.style.transform = 'scale(' + viewport.getBoundingClientRect().width / 450 + ')';
  }
  new ResizeObserver(fitGame).observe(viewport);

  function closePlayer() {
    if (player.open) player.close();
    viewport.replaceChildren();
    activeId = null;
    document.body.classList.remove('playing');
    if (location.hash.indexOf('#play/') === 0) history.replaceState(null, '', location.pathname + location.search);
    if (returnFocus) returnFocus.focus();
  }

  function syncPlayer() {
    var id = location.hash.indexOf('#play/') === 0 ? location.hash.slice(6) : null;
    var link = id && document.querySelector('[data-game="' + CSS.escape(id) + '"]');
    if (!link) { if (player.open) closePlayer(); return; }
    if (activeId === id) return;
    returnFocus = link;
    document.getElementById('player-title').textContent = link.dataset.title;
    var frame = document.createElement('iframe');
    frame.title = link.dataset.title + ' — game';
    frame.src = 'games/' + id + '/';
    frame.allow = 'autoplay; fullscreen';
    frame.addEventListener('load', function () {
      try {
        frame.contentWindow.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { e.preventDefault(); closePlayer(); }
        });
      } catch (_) {}
    });
    viewport.replaceChildren(frame);
    activeId = id;
    document.body.classList.add('playing');
    if (!player.open) player.showModal();
    fitGame();
    closeButton.focus();
  }

  document.addEventListener('click', function (e) {
    var link = e.target.closest('[data-game]');
    if (!link || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    var hash = '#play/' + link.dataset.game;
    if (location.hash === hash) syncPlayer(); else location.hash = hash;
  });
  closeButton.addEventListener('click', closePlayer);
  player.addEventListener('cancel', function (e) { e.preventDefault(); closePlayer(); });
  player.addEventListener('click', function (e) {
    if (e.target !== player) return;
    var r = player.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closePlayer();
  });
  window.addEventListener('hashchange', syncPlayer);
  syncPlayer();
})();
</script>

</body>
</html>
